services:
  mysql:
    image: mysql:8.0
    container_name: law-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: law_contract
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: law-backend
    depends_on:
      - mysql
    environment:
      DATABASE_URL: mysql+pymysql://root:root123@mysql:3306/law_contract?charset=utf8mb4
      LLM_API_KEY: ${LLM_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      EMBEDDING_MODEL: BAAI/bge-small-zh-v1.5
    ports:
      - "8000:8000"
    volumes:
      - vector_data:/app/vector_store
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  vector_data:
  uploads_data:
